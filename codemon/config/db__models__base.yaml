pathname: db/models/base.py

module:
  new_imports:
    - "from django.db.models.base import ModelBase"
    - "from django.utils.functional import classproperty"
    - "from django_async_backend.db import async_connections"
    - "from django_async_backend.db.models.constraints import avalidate_constraint"
    - "from django_async_backend.db.models.deletion import Collector"
    - "from django_async_backend.db.models.manager import AsyncManager"
    - "from django_async_backend.db.transaction import async_atomic"
    - "from django_async_backend.db.transaction import async_mark_for_rollback_on_error"

  import_aliases:
    - name: connections
      remove: true
    - name: Collector
      remove: true
    - name: FETCH_ONE
      remove: true
    - name: DO_NOTHING
      remove: true
    - name: DatabaseOnDelete
      remove: true

  assigns:
    - target:
        name: DEFERRED
      remove: true

    - target:
        value: model_unpickle
      remove: true

  functions:
    subclass_exception:
      remove: true

    _has_contribute_to_class:
      remove: true

    method_set_order:
      remove: true

    method_get_order:
      remove: true

    make_foreign_order_accessors:
      remove: true

    model_unpickle:
      remove: true

  classes:
    Deferred:
      remove: true

    ModelBase:
      remove: true

    ModelStateFieldsCacheDescriptor:
      remove: true

    ModelStateFetchModeDescriptor:
      remove: true

    ModelState:
      remove: true

    Model:
      rename: AsyncModelMixin
      clear_bases: true
      add_raw_top:
        - |
          async def _async_clean(self):
              # Model.aclean() may query; Model.clean() must not.
              if hasattr(self, "aclean"):
                  return await self.aclean()
              return self.clean()
        - |
          @classproperty
          def async_objects(cls):
              manager = cls.__dict__.get("_async_objects_cache")
              if manager is None:
                  manager = AsyncManager()
                  manager.name = "async_objects"
                  manager.model = cls
                  cls._async_objects_cache = manager
              return manager
        - |
          @classproperty
          def _async_base_manager(cls):
              manager = cls.__dict__.get("_async_base_manager_cache")
              if manager is None:
                  manager = AsyncManager()
                  manager.name = "_async_base_manager"
                  manager.model = cls
                  manager.auto_created = True
                  cls._async_base_manager_cache = manager
              return manager
        - |
          async def async_refresh_from_db(
              self, using=None, fields=None, from_queryset=None
          ):
              """Django's ``refresh_from_db()`` on the async connection.

              ``fields`` and ``from_queryset`` work as in Django (a sync
              ``from_queryset`` is converted). One difference: with
              ``fields=None`` every concrete field is reloaded, deferred ones
              included, because reading a deferred field afterwards would go
              through the sync ORM and raise ``SynchronousOnlyOperation``.
              """
              from django_async_backend.db.models.convert import (
                  to_async_queryset,
              )

              if fields is None:
                  self._prefetched_objects_cache = {}
              else:
                  prefetched_objects_cache = getattr(
                      self, "_prefetched_objects_cache", ()
                  )
                  fields = set(fields)
                  for field in fields.copy():
                      if field in prefetched_objects_cache:
                          del prefetched_objects_cache[field]
                          fields.remove(field)
                  if not fields:
                      return
                  if any(LOOKUP_SEP in f for f in fields):
                      raise ValueError(
                          'Found "%s" in fields argument. Relations and '
                          "transforms are not allowed in fields." % LOOKUP_SEP
                      )

              if from_queryset is None:
                  hints = {"instance": self}
                  from_queryset = self.__class__._async_base_manager.db_manager(
                      using, hints=hints
                  )
              else:
                  from_queryset = to_async_queryset(from_queryset)
                  if using is not None:
                      from_queryset = from_queryset.using(using)

              db_instance_qs = from_queryset.filter(pk=self.pk)
              if fields is not None:
                  db_instance_qs = db_instance_qs.only(*fields)

              db_instance = await db_instance_qs.aget()
              non_loaded_fields = db_instance.get_deferred_fields()
              for field in self._meta.fields:
                  if field.attname in non_loaded_fields:
                      # This field wasn't refreshed - skip ahead.
                      continue
                  if field.concrete:
                      setattr(
                          self, field.attname, getattr(db_instance, field.attname)
                      )
                  # Clear or copy cached foreign keys.
                  if field.is_relation:
                      if field.is_cached(db_instance):
                          field.set_cached_value(
                              self, field.get_cached_value(db_instance)
                          )
                      elif field.is_cached(self):
                          field.delete_cached_value(self)

              # Clear cached relations.
              for rel in self._meta.related_objects:
                  if (fields is None or rel.name in fields) and rel.is_cached(
                      self
                  ):
                      rel.delete_cached_value(self)

              # Clear cached private relations.
              for field in self._meta.private_fields:
                  if (
                      (fields is None or field.name in fields)
                      and field.is_relation
                      and field.is_cached(self)
                  ):
                      field.delete_cached_value(self)

              self._state.db = db_instance._state.db
        - |
          async def _async_get_next_or_previous_by_FIELD(
              self, field, is_next, **kwargs
          ):
              # Behind aget_next_by_<field>() / aget_previous_by_<field>(),
              # attached per model by db/models/ordering.py.
              if not self._async_is_pk_set():
                  raise ValueError(
                      "get_next/get_previous cannot be used on unsaved objects."
                  )
              op = "gt" if is_next else "lt"
              order = "" if is_next else "-"
              param = getattr(self, field.attname)
              q = Q.create(
                  [(field.name, param), (f"pk__{op}", self.pk)], connector=Q.AND
              )
              q = Q.create([q, (f"{field.name}__{op}", param)], connector=Q.OR)
              qs = (
                  self.__class__.async_objects.using(self._state.db)
                  .filter(**kwargs)
                  .filter(q)
                  .order_by("%s%s" % (order, field.name), "%spk" % order)
              )
              obj = await qs.afirst()
              if obj is None:
                  raise self.DoesNotExist(
                      "%s matching query does not exist."
                      % self.__class__._meta.object_name
                  )
              return obj
        - |
          async def _async_get_next_or_previous_in_order(self, is_next):
              # Behind aget_next_in_order() / aget_previous_in_order() of a
              # model with order_with_respect_to (db/models/ordering.py).
              cachename = "__%s_order_cache" % is_next
              if not hasattr(self, cachename):
                  op = "gt" if is_next else "lt"
                  order = "_order" if is_next else "-_order"
                  order_field = self._meta.order_with_respect_to
                  filter_args = order_field.get_filter_kwargs_for_object(self)
                  manager = self.__class__.async_objects
                  obj = await (
                      manager.filter(**filter_args)
                      .filter(
                          **{
                              "_order__%s"
                              % op: manager.values("_order").filter(
                                  **{self._meta.pk.name: self.pk}
                              )
                          }
                      )
                      .order_by(order)[:1]
                      .aget()
                  )
                  setattr(self, cachename, obj)
              return getattr(self, cachename)

      assigns:
        - target:
            name: pk
          remove: true

        - target:
            value: save
            rename:
              value: async_save

        - target:
            value: save_base
            rename:
              value: _async_save_base

        - target:
            value: asave
          remove: true

        - target:
            value: delete
            rename:
              value: async_delete

        - target:
            value: adelete
          remove: true

      methods:
        __init__:
          remove: true

        from_db:
          remove: true

        __repr__:
          remove: true

        __str__:
          remove: true

        __eq__:
          remove: true

        __hash__:
          remove: true

        __reduce__:
          remove: true

        __getstate__:
          remove: true

        __setstate__:
          remove: true

        _get_pk_val:
          rename: _async_get_pk_val

        _set_pk_val:
          remove: true

        _is_pk_set:
          rename: _async_is_pk_set
          calls:
            - func:
                attr: _get_pk_val
                rename:
                  attr: _async_get_pk_val

        get_deferred_fields:
          remove: true

        refresh_from_db:
          remove: true

        arefresh_from_db:
          remove: true

        serializable_value:
          remove: true

        _validate_force_insert:
          rename: _async_validate_force_insert

        asave:
          remove: true

        save:
          rename: async_save
          to_async: true
          calls:
            - func:
                attr: _prepare_related_fields_for_save
                rename:
                  attr: _async_prepare_related_fields_for_save
              to_await: true
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set
            - func:
                attr: save_base
                rename:
                  attr: _async_save_base
              to_await: true

        save_base:
          rename: _async_save_base
          to_async: true
          context_managers:
            - to_async: true
          calls:
            - func:
                attr: _validate_force_insert
                rename:
                  attr: _async_validate_force_insert
            - func:
                attr: _save_parents
                rename:
                  attr: _async_save_parents
              to_await: true
            - func:
                value: transaction
                attr: atomic
                rename:
                  name: async_atomic
            - func:
                value: transaction
                attr: mark_for_rollback_on_error
                rename:
                  name: async_mark_for_rollback_on_error
            - func:
                value: pre_save
                attr: send
                rename:
                  attr: asend
              to_await: true
            - func:
                value: post_save
                attr: send
                rename:
                  attr: asend
              to_await: true
            - func:
                attr: _save_table
                rename:
                  attr: _async_save_table
              to_await: true

        _save_table:
          rename: _async_save_table
          to_async: true
          attrs:
            - name: connections
              rename:
                name: async_connections
            - name: _base_manager
              rename:
                name: _async_base_manager
          calls:
            - func:
                attr: aggregate
              replace_raw: |
                (
                    await cls._async_base_manager.using(using)
                    .filter(**filter_args)
                    .aaggregate(
                        _order__max=Coalesce(
                            ExpressionWrapper(
                                Max("_order") + Value(1),
                                output_field=IntegerField(),
                            ),
                            Value(0),
                        ),
                    )
                )
            - func:
                attr: _do_update
                rename:
                  attr: _async_do_update
              to_await: true
            - func:
                attr: _assign_returned_values
                rename:
                  attr: _async_assign_returned_values
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set
            - func:
                attr: _get_pk_val
                rename:
                  attr: _async_get_pk_val
            - func:
                attr: _do_insert
              replace_raw: |
                await self._async_do_insert(
                    cls._async_base_manager,
                    using,
                    insert_fields,
                    returning_fields,
                    raw,
                )

        _save_parents:
          rename: _async_save_parents
          to_async: true
          calls:
            - func:
                attr: _save_parents
                rename:
                  attr: _async_save_parents
              to_await: true
            - func:
                attr: _save_table
                rename:
                  attr: _async_save_table
              to_await: true
            - func:
                attr: _get_pk_val
                rename:
                  attr: _async_get_pk_val

        _do_update:
          rename: _async_do_update
          to_async: true
          calls:
            - func:
                value: filtered
                attr: exists
                rename:
                  attr: aexists
              to_await: true
            - func:
                value: filtered
                attr: _update
              to_await: true

        _do_insert:
          rename: _async_do_insert
          to_async: true
          calls:
            - func:
                value: manager
                attr: _insert
              to_await: true

        _assign_returned_values:
          rename: _async_assign_returned_values

        _prepare_related_fields_for_save:
          rename: _async_prepare_related_fields_for_save
          to_async: true
          calls:
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set

        delete:
          rename: async_delete
          to_async: true
          calls:
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set
            - func:
                value: collector
                attr: collect
              to_await: true
            - func:
                value: collector
                attr: delete
              to_await: true

        adelete:
          remove: true

        _get_FIELD_display:
          remove: true

        _get_next_or_previous_by_FIELD:
          remove: true

        _get_next_or_previous_in_order:
          remove: true

        _get_field_expression_map:
          remove: true

        prepare_database_save:
          remove: true

        clean:
          remove: true

        # Validation: the pure parts (clean_fields, clean, _get_unique_checks,
        # get_constraints, error messages) stay Django's own, the parts that
        # query get async twins on async_objects.
        validate_unique:
          rename: async_validate_unique
          to_async: true
          calls:
            - func:
                attr: _perform_unique_checks
                rename:
                  attr: _async_perform_unique_checks
              to_await: true
            - func:
                attr: _perform_date_checks
                rename:
                  attr: _async_perform_date_checks
              to_await: true

        _get_unique_checks:
          remove: true

        _perform_unique_checks:
          rename: _async_perform_unique_checks
          to_async: true
          attrs:
            - attr: _default_manager
              rename:
                attr: async_objects
          calls:
            - func:
                attr: exists
                rename:
                  attr: aexists
              to_await: true
            - func:
                attr: _get_pk_val
                rename:
                  attr: _async_get_pk_val
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set

        _perform_date_checks:
          rename: _async_perform_date_checks
          to_async: true
          attrs:
            - attr: _default_manager
              rename:
                attr: async_objects
          calls:
            - func:
                attr: exists
                rename:
                  attr: aexists
              to_await: true
            - func:
                attr: _get_pk_val
                rename:
                  attr: _async_get_pk_val
            - func:
                attr: _is_pk_set
                rename:
                  attr: _async_is_pk_set

        date_error_message:
          remove: true

        unique_error_message:
          remove: true

        get_constraints:
          remove: true

        validate_constraints:
          rename: async_validate_constraints
          to_async: true
          calls:
            - func:
                value: constraint
                attr: validate
              replace_raw: |
                await avalidate_constraint(
                    constraint, model_class, self, exclude=exclude, using=using
                )

        full_clean:
          rename: async_full_clean
          to_async: true
          calls:
            # Model.aclean() when the model defines one (it may query).
            - func:
                attr: clean
              replace_raw: "await self._async_clean()"
            # ForeignKey.validate() queries: the hand-written aclean_fields()
            # (db/models/validation.py) checks existence with aexists().
            - func:
                attr: clean_fields
                rename:
                  attr: aclean_fields
              to_await: true
            - func:
                attr: validate_unique
                rename:
                  attr: async_validate_unique
              to_await: true
            - func:
                attr: validate_constraints
                rename:
                  attr: async_validate_constraints
              to_await: true

        clean_fields:
          remove: true

        check:
          remove: true

        _check_composite_pk:
          remove: true

        _check_db_table_comment:
          remove: true

        _check_swappable:
          remove: true

        _check_model:
          remove: true

        _check_managers:
          remove: true

        _check_fields:
          remove: true

        _check_m2m_through_same_relationship:
          remove: true

        _check_id_field:
          remove: true

        _check_field_name_clashes:
          remove: true

        _check_column_name_clashes:
          remove: true

        _check_model_name_db_lookup_clashes:
          remove: true

        _check_property_name_related_field_accessor_clashes:
          remove: true

        _check_single_primary_key:
          remove: true

        _check_unique_together:
          remove: true

        _check_indexes:
          remove: true

        _check_local_fields:
          remove: true

        _check_ordering:
          remove: true

        _check_long_column_names:
          remove: true

        _get_expr_references:
          remove: true

        _check_constraints:
          remove: true

        _check_related_fields:
          remove: true

# Code review notes
#
# - 100% coverage.
# - Don't use mocks in tests (if not accepted in test comment).
# - Don't test private methods.
