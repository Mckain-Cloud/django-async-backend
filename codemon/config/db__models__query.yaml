          async def aiterator(self, chunk_size=2000):
              """
              An asynchronous iterator over the results from applying this
              QuerySet to the database, streamed through a server-side cursor
              when the backend allows it.
              """
              if chunk_size <= 0:
                  raise ValueError("Chunk size must be strictly positive.")
              use_chunked_fetch = not async_connections[
                  self.db
              ].settings_dict.get("DISABLE_SERVER_SIDE_CURSORS")
